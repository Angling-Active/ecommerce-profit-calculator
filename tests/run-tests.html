<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EOPC — Calculator unit tests</title>
  <style>
    :root {
      --ink: #1a2332;
      --muted: #5a6577;
      --ok: #1b6b3a;
      --bad: #9b1c1c;
      --bg: #f6f7f9;
      --card: #fff;
      --line: #d8dee8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      padding: 1.5rem;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.25rem; }
    .summary { color: var(--muted); margin-bottom: 1.25rem; }
    .suite { margin: 1rem 0 0.35rem; font-weight: 650; font-size: 0.95rem; }
    .pass { color: var(--ok); }
    .fail { color: var(--bad); font-weight: 600; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      max-width: 52rem;
    }
    #results { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; font-size: 0.82rem; }
    .banner {
      display: inline-block;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      font-weight: 650;
      margin-bottom: 1rem;
    }
    .banner.ok { background: #e5f5ea; color: var(--ok); }
    .banner.bad { background: #fde8e8; color: var(--bad); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Order profitability calculator — tests</h1>
    <p class="summary">Browser harness for <code>js/calc.js</code>. Open this file locally; no build step.</p>
    <div id="banner"></div>
    <div id="results"></div>
  </div>

  <script>
    (function () {
      var results = document.getElementById('results');
      var banner = document.getElementById('banner');
      var passed = 0;
      var failed = 0;
      var lines = [];

      function write(html) {
        lines.push(html);
        results.innerHTML = lines.join('');
      }

      window.EopcAssert = {
        suite: function (name) {
          write('<div class="suite">' + name + '</div>');
        },
        ok: function (cond, msg) {
          if (cond) {
            passed++;
            write('<div class="pass">✓ ' + msg + '</div>');
          } else {
            failed++;
            write('<div class="fail">✗ ' + msg + '</div>');
          }
        },
        equal: function (actual, expected, msg) {
          var ok = Object.is(actual, expected) || actual === expected;
          this.ok(ok, (msg || 'equal') + ' (expected ' + expected + ', got ' + actual + ')');
        },
        done: function () {
          var total = passed + failed;
          banner.className = 'banner ' + (failed ? 'bad' : 'ok');
          banner.textContent = failed
            ? failed + ' failed / ' + total + ' assertions'
            : 'All ' + total + ' assertions passed';
          document.title = (failed ? 'FAIL' : 'PASS') + ' — EOPC tests';
        },
      };
    })();
  </script>
  <script src="../js/calc.js"></script>
  <script src="calc.test.js"></script>
</body>
</html>
